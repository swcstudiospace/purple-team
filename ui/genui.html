<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      Phase 36 §6.1 sandbox posture. The frame runs with sandbox="allow-scripts"
      (opaque origin), so scripts can never read the app's storage or DOM; this
      CSP is the hard network cut — connect-src 'none' — plus no popups, forms,
      or top navigation by policy. Everything loads from this origin; no
      external URL is reachable.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'none'; img-src data:"
    />
    <title>Generated UI sandbox</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/genui/frame-main.tsx"></script>
  </body>
</html>
