<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      Phase 36 §6.1 sandbox posture. The frame runs with sandbox="allow-scripts"
      (opaque origin), so scripts can never read the app's storage or DOM.
      An opaque origin never matches the 'self' source expression, so the frame
      bundle is allowed by loopback origin instead: script and style loads are
      restricted to 127.0.0.1 and localhost on any port (the server binds
      loopback only), so generated UI cannot pull code or fonts from external
      hosts. connect-src 'none' cuts fetch, XHR and WebSocket, and img-src data:
      blocks remote images, which are the other exfiltration channel. In
      LAN-bound mode (T3MP3ST_HOST set to a non-loopback address) the frame
      cannot load its bundle, and the thread falls back to the raw source view.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src http://127.0.0.1:* http://localhost:*; style-src http://127.0.0.1:* http://localhost:* 'unsafe-inline'; font-src http://127.0.0.1:* http://localhost:*; img-src data:; connect-src 'none'"
    />
    <title>Generated UI sandbox</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/genui/frame-main.tsx"></script>
  </body>
</html>
