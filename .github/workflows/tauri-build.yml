name: Tauri shell build

# Desktop bundles build on every push and on PRs to main. Pushes also publish the
# desktop installers as a prerelease (build-<short sha>). Mobile jobs are manual
# dispatch only (they need signing identities plus Xcode / Android SDK+NDK toolchains).
on:
  push:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      mobile:
        description: 'Also run the manual mobile init-check jobs (ios/android)'
        required: false
        default: 'false'

permissions:
  contents: read

concurrency:
  group: t3mp3st-tauri-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  desktop:
    name: Desktop bundle (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: linux
            args: --bundles deb,appimage
          - os: windows-latest
            target: windows
            args: --bundles msi,nsis
          - os: macos-latest
            target: macos
            args: --bundles app,dmg
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux webkit/ayatana deps
        if: matrix.target == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: npm ci
      - run: npm run build
      - name: Build server sidecar
        run: npm run sidecar:build
      - name: Build Tauri bundle
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: ${{ matrix.args }}
      - name: Restore pre-linuxdeploy sidecar in AppImage
        if: matrix.target == 'linux'
        env:
          # appimagetool 1.9.1 x86_64 release asset, pinned by sha256.
          APPIMAGETOOL_SHA256: ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0
        run: |
          set -euo pipefail
          tool="$RUNNER_TEMP/appimagetool"
          curl -sfL -o "$tool" https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage
          echo "$APPIMAGETOOL_SHA256  $tool" | sha256sum -c -
          chmod +x "$tool"
          shopt -s nullglob
          apps=(src-tauri/target/release/bundle/appimage/*.AppImage)
          [ "${#apps[@]}" -eq 1 ] || { echo "expected one AppImage, found ${#apps[@]}"; exit 1; }
          bash scripts/repack-linux-appimage.sh "${apps[0]}" src-tauri/binaries/t3mp3st-server-x86_64-unknown-linux-gnu "$tool"
      - name: Upload desktop bundles
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: desktop-${{ matrix.target }}
          if-no-files-found: error
          retention-days: 14
          path: |
            src-tauri/target/release/bundle/**/*.deb
            src-tauri/target/release/bundle/**/*.AppImage
            src-tauri/target/release/bundle/**/*.msi
            src-tauri/target/release/bundle/**/*-setup.exe
            src-tauri/target/release/bundle/**/*.dmg

  install-launch:
    name: Install and launch (linux, headless container)
    # Runs after the whole desktop matrix succeeds, so the linux .deb and AppImage exist.
    needs: desktop
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    env:
      # Pinned by digest (ubuntu:22.04 index digest as pulled on 2026-10-21).
      CONTAINER_IMAGE: ubuntu:22.04@sha256:0a9887931b0e38af2e3487ed39e29436b0535c4f3f52e57745baaf79d1898956
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Download Linux desktop bundles
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: gh run download "$RUN_ID" --name desktop-linux --dir dist/linux
      - name: Install and launch check (headless ubuntu 22.04 container)
        env:
          SOURCE_SHA: ${{ github.sha }}
          SOURCE_RUN_ID: ${{ github.run_id }}
          CI_ARTIFACT: desktop-linux
        run: |
          mkdir -p receipt
          docker run --rm \
            --env CONTAINER_IMAGE \
            --env SOURCE_SHA \
            --env SOURCE_RUN_ID \
            --env CI_ARTIFACT \
            --volume "$PWD/dist/linux:/artifacts:ro" \
            --volume "$PWD/receipt:/receipt" \
            --volume "$PWD/scripts/desktop-install-launch-check.sh:/check/desktop-install-launch-check.sh:ro" \
            "$CONTAINER_IMAGE" \
            bash /check/desktop-install-launch-check.sh /artifacts /receipt
      - name: Job summary
        if: always()
        run: |
          if [ -s receipt/summary.md ]; then
            cat receipt/summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "## Desktop install and launch (Linux, headless)"
              echo ""
              echo "No receipt was written: the container check stopped before completing."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload install-launch receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: desktop-install-launch-receipt
          if-no-files-found: error
          retention-days: 14
          path: receipt/receipt.json

  ios:
    name: iOS init check (manual only)
    if: github.event_name == 'workflow_dispatch' && inputs.mobile == 'true'
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim
      - run: npm ci
      - run: npx --no-install @tauri-apps/cli ios init
      - run: npx --no-install @tauri-apps/cli ios build --export-method debugging

  android:
    name: Android init check (manual only)
    if: github.event_name == 'workflow_dispatch' && inputs.mobile == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android,i686-linux-android
      - uses: android-actions/setup-android@v3
      - run: npm ci
      - run: npx --no-install @tauri-apps/cli android init
      - run: npx --no-install @tauri-apps/cli android build

  publish:
    name: Publish prerelease
    needs: desktop
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      actions: read
    steps:
      - name: Download desktop bundles
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: gh run download "$RUN_ID" --dir dist
      - name: Create or update build prerelease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          SHORT="${GITHUB_SHA:0:7}"
          TAG="build-$SHORT"
          files=()
          while IFS= read -r -d '' f; do
            files+=("$f")
          done < <(find dist -type f -print0)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No desktop bundles found under dist/" >&2
            exit 1
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${files[@]}" --clobber
          else
            gh release create "$TAG" --target "$GITHUB_SHA" --prerelease \
              --title "Purple Team build $SHORT" \
              --notes "Native desktop packages built from $GITHUB_SHA" \
              "${files[@]}"
          fi
